<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">NEXAH Lantern on Pole binding frame</title>
  <desc id="desc">A source-bound synthesis view separating known display roles, existing lantern evidence, exact neighboring epsilon return mathematics and missing binding gates.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#24203a"/>
      <stop offset="1" stop-color="#07141c"/>
    </radialGradient>
    <radialGradient id="lamp" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#fff8b7"/>
      <stop offset="0.38" stop-color="#ffc542"/>
      <stop offset="1" stop-color="#ff7926" stop-opacity="0.08"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f5efe7}
      .micro{font-size:18px;letter-spacing:2px;fill:#9fb0ba}
      .label{font-size:22px;font-weight:700;letter-spacing:1px}
      .value{font-size:25px;font-weight:800}
      .title{font-family:system-ui,sans-serif;font-size:47px;font-weight:750;letter-spacing:-1px}
      .gold{fill:#f5bd42}.orange{fill:#ff8a25}.pink{fill:#ee48ae}.cyan{fill:#4ecbd0}.muted{fill:#a9b5bd}
      .panel{fill:#0d1119;stroke:#3e3b32;stroke-width:2}
      .line{fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
