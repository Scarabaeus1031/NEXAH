  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;pascal-pentagon-suite&#x27;);
      const svg = root.querySelector(&#x27;svg&#x27;);
      const operatorControls = root.querySelector(&#x27;.pps-operator-controls&#x27;);
      const growthControls = root.querySelector(&#x27;.pps-growth-controls&#x27;);
      const couplingControls = root.querySelector(&#x27;.pps-coupling-controls&#x27;);
      const d30Controls = root.querySelector(&#x27;.pps-d30-controls&#x27;);
      const metrics = root.querySelector(&#x27;.pps-metrics&#x27;);
      const detail = root.querySelector(&#x27;.pps-detail&#x27;);
      const result = root.querySelector(&#x27;.pps-result&#x27;);
      const NS = &#x27;http://www.w3.org/2000/svg&#x27;;
      const center = { x: 325, y: 285 };
      const radius = 232;
      const depth = 6;
      const saved = window.openai?.widgetState?.modelContent || {};
      let mode = [&#x27;structure&#x27;, &#x27;metric&#x27;, &#x27;boundary&#x27;, &#x27;lift&#x27;, &#x27;roots&#x27;, &#x27;growth&#x27;, &#x27;coupling&#x27;, &#x27;d30&#x27;].includes(saved.mode) ? saved.mode : &#x27;structure&#x27;;
      let op = [&#x27;0&#x27;, &#x27;1&#x27;, &#x27;2&#x27;, &#x27;3&#x27;, &#x27;4&#x27;, &#x27;m&#x27;].includes(String(saved.op)) ? String(saved.op) : &#x27;0&#x27;;
      let growthStep = [&#x27;1&#x27;, &#x27;2&#x27;, &#x27;3&#x27;, &#x27;4&#x27;, &#x27;5&#x27;, &#x27;closed&#x27;].includes(String(saved.growthStep)) ? String(saved.growthStep) : &#x27;5&#x27;;
      let couplingView = [&#x27;cycles&#x27;, &#x27;triangles&#x27;, &#x27;handle7&#x27;, &#x27;octagon&#x27;].includes(saved.couplingView) ? saved.couplingView : &#x27;cycles&#x27;;
      let dRegister = Number.isInteger(saved.dRegister) &amp;&amp; saved.dRegister &gt;= 0 &amp;&amp; saved.dRegister &lt; 5 ? saved.dRegister : 0;
      let branchWord = typeof saved.branchWord === &#x27;string&#x27; &amp;&amp; /^[LR]{0,6}$/.test(saved.branchWord) ? saved.branchWord : &#x27;LRRL&#x27;;
      const vertices = Array.from({ length: 5 }, (_, i) =&gt; {
        const angle = -Math.PI / 2 + i * 2 * Math.PI / 5;
        return { x: center.x + radius * Math.cos(angle), y: center.y + radius * Math.sin(angle) };
      });
      const make = (name, attrs = {}) =&gt; {
        const node = document.createElementNS(NS, name);
        Object.entries(attrs).forEach(([key, value]) =&gt; node.setAttribute(key, value));
        return node;
      };
      const line = (a, b, className) =&gt; make(&#x27;line&#x27;, { x1:a.x, y1:a.y, x2:b.x, y2:b.y, class:className });
      const textNode = (x, y, value, className = &#x27;pps-label&#x27;) =&gt; {
        const node = make(&#x27;text&#x27;, { x, y, class:className });
        node.textContent = value;
        return node;
      };
      const polar = (cx, cy, r, degrees) =&gt; {
        const angle = (degrees - 90) * Math.PI / 180;
        return { x:cx + r*Math.cos(angle), y:cy + r*Math.sin(angle) };
      };
      const branchPhases = word =&gt; {
        let phase = 0;
        const path = [phase];
        for (const branch of word) {
          phase = (phase + (branch === &#x27;R&#x27; ? 1 : 29)) % 30;
          path.push(phase);
        }
        return path;
      };
      const point = (face, n, k) =&gt; {
        if (n === 0) return center;
        const t = n / depth;
        const q = k / n;
        const a = vertices[face];
        const b = vertices[(face + 1) % 5];
        return { x:center.x*(1-t)+t*((1-q)*a.x+q*b.x), y:center.y*(1-t)+t*((1-q)*a.y+q*b.y) };
      };
      const choose = (n, k) =&gt; {
        let value = 1;
        for (let i = 1; i &lt;= k; i++) value = value * (n - i + 1) / i;
        return value;
      };
      const stat = (label, value) =&gt; `&lt;div class=&quot;card viz-stat&quot;&gt;&lt;span class=&quot;text-muted&quot;&gt;${label}&lt;/span&gt;&lt;div class=&quot;viz-stat-value tabular-nums&quot;&gt;${value}&lt;/div&gt;&lt;/div&gt;`;
      const activeFace = () =&gt; op === &#x27;m&#x27; ? 4 : Number(op);

      function drawCarrier(showGrid = true) {
        const edges = make(&#x27;g&#x27;);
        const seams = make(&#x27;g&#x27;);
        const nodes = make(&#x27;g&#x27;);
        svg.append(edges, seams, nodes);
        if (showGrid) {
          for (let face = 0; face &lt; 5; face++) for (let n = 0; n &lt; depth; n++) for (let k = 0; k &lt;= n; k++) {
            const p = point(face, n, k);
            edges.append(line(p, point(face, n + 1, k), &#x27;pps-edge&#x27;));
            edges.append(line(p, point(face, n + 1, k + 1), &#x27;pps-edge&#x27;));
          }
        }
        for (let face = 0; face &lt; 5; face++) seams.append(line(center, vertices[face], &#x27;pps-seam&#x27;));
        for (let face = 0; face &lt; 5; face++) for (let n = 1; n &lt;= depth; n++) {
          const seam = point(face, n, 0);
          nodes.append(make(&#x27;circle&#x27;, { cx:seam.x, cy:seam.y, r:3, class:&#x27;pps-node&#x27; }));
          for (let k = 1; k &lt; n; k++) {
            const p = point(face, n, k);
            const isTwenty = n === depth &amp;&amp; k === 3;
            const className = isTwenty &amp;&amp; mode === &#x27;structure&#x27; &amp;&amp; face === activeFace() ? &#x27;pps-node pps-active&#x27; : &#x27;pps-node&#x27;;
            nodes.append(make(&#x27;circle&#x27;, { cx:p.x, cy:p.y, r:isTwenty ? 14 : 2.5 + Math.log2(choose(n,k)+1), class:className }));
            if (isTwenty) nodes.append(textNode(p.x, p.y, &#x27;20&#x27;));
          }
        }
        nodes.append(make(&#x27;circle&#x27;, { cx:center.x, cy:center.y, r:17, class:&#x27;pps-node&#x27; }));
        nodes.append(textNode(center.x, center.y, mode === &#x27;structure&#x27; ? (op === &#x27;m&#x27; ? &#x27;m&#x27; : op === &#x27;0&#x27; ? &#x27;e&#x27; : `r${op}`) : &#x27;1&#x27;, &#x27;pps-label pps-gold&#x27;));
      }

      function drawStructure() {
        drawCarrier(true);
        metrics.innerHTML = stat(&#x27;Layers&#x27;,&#x27;7&#x27;) + stat(&#x27;Nodes&#x27;,&#x27;106&#x27;) + stat(&#x27;Rotation&#x27;,&#x27;C₅&#x27;) + stat(&#x27;Full group&#x27;,&#x27;D₅&#x27;);
        detail.innerHTML = &#x27;&lt;strong&gt;4 turns + return&lt;/strong&gt;&lt;p&gt;r⁵ = e · m² = e · mrm = r⁻¹&lt;/p&gt;&#x27;;
        result.textContent = &#x27;PENT-01 · PASS · connected weighted recurrence carrier&#x27;;
      }

      function drawMetric() {
        drawCarrier(false);
        const diagonals = make(&#x27;g&#x27;);
        svg.prepend(diagonals);
        for (let i = 0; i &lt; 5; i++) {
          diagonals.append(line(vertices[i], vertices[(i+2)%5], &#x27;pps-diagonal&#x27;));
          diagonals.append(line(vertices[i], vertices[(i+1)%5], &#x27;pps-edge&#x27;));
        }
        const sideMid = { x:(vertices[1].x+vertices[2].x)/2, y:(vertices[1].y+vertices[2].y)/2 };
        const diagMid = { x:(vertices[0].x+vertices[2].x)/2, y:(vertices[0].y+vertices[2].y)/2 };
        svg.append(textNode(sideMid.x+25, sideMid.y, &#x27;d&#x27;));
        svg.append(textNode(diagMid.x-18, diagMid.y-12, &#x27;φd&#x27;));
        metrics.innerHTML = stat(&#x27;Side&#x27;,&#x27;1.17557&#x27;) + stat(&#x27;Diagonal&#x27;,&#x27;1.90211&#x27;) + stat(&#x27;Ratio&#x27;,&#x27;φ&#x27;) + stat(&#x27;Tolerance&#x27;,&#x27;10⁻¹⁰&#x27;);
        detail.innerHTML = &#x27;&lt;strong&gt;Exact metric realization&lt;/strong&gt;&lt;p&gt;Diagonal / side = golden section = φ ≈ 1.61803398875.&lt;/p&gt;&#x27;;
        result.textContent = &#x27;PENT-02 · PASS · C₅/D₅ acts by Euclidean isometries&#x27;;
      }

      function drawBoundary() {
        const positions = [43,83,83,97,137];
        const group = make(&#x27;g&#x27;);
        svg.append(group);
        for (let i = 0; i &lt; 5; i++) {
          group.append(line(vertices[i], vertices[(i+1)%5], &#x27;pps-edge&#x27;));
          group.append(line(vertices[i], vertices[(i+2)%5], &#x27;pps-diagonal&#x27;));
          group.append(make(&#x27;circle&#x27;, { cx:vertices[i].x, cy:vertices[i].y, r:22, class:i===1||i===2 ? &#x27;pps-warning&#x27; : &#x27;pps-node&#x27; }));
          group.append(textNode(vertices[i].x, vertices[i].y, String(positions[i])));
        }
        group.append(make(&#x27;circle&#x27;, { cx:center.x, cy:center.y, r:48, class:&#x27;pps-ok&#x27; }));
        group.append(textNode(center.x, center.y-8, &#x27;360&#x27;));
        group.append(textNode(center.x, center.y+16, &#x27;4 labels&#x27;, &#x27;pps-small&#x27;));
        group.append(textNode(center.x, 548, &#x27;five positions = 443 · duplicated 83&#x27;, &#x27;pps-small&#x27;));
        metrics.innerHTML = stat(&#x27;4-label sum&#x27;,&#x27;360&#x27;) + stat(&#x27;5-position sum&#x27;,&#x27;443&#x27;) + stat(&#x27;Unique labels&#x27;,&#x27;4&#x27;) + stat(&#x27;3D lift&#x27;,&#x27;PENT-04 PASS&#x27;);
        detail.innerHTML = &#x27;&lt;strong&gt;Boundary detected&lt;/strong&gt;&lt;p&gt;17+3=20 · 13+7=20 · 17+13=30. Labels and resonance remain undefined; PENT-04 answers only the carrier question.&lt;/p&gt;&#x27;;
        result.textContent = &#x27;PENT-03 · PASS WITH BOUNDARY · arithmetic retained, geometry not admitted&#x27;;
      }

      function drawLift() {
        const equator = Array.from({ length:5 }, (_, i) =&gt; {
          const angle = -Math.PI / 2 + i * 2 * Math.PI / 5;
          return { x:325 + 206*Math.cos(angle), y:285 + 76*Math.sin(angle) };
        });
        const zenith = { x:325, y:62 };
        const nadir = { x:325, y:508 };
        const faces = make(&#x27;g&#x27;);
        const edges = make(&#x27;g&#x27;);
        const nodes = make(&#x27;g&#x27;);
        svg.append(faces, edges, nodes);
        for (let i=0; i&lt;5; i++) {
          const next = (i+1)%5;
          const topFace = make(&#x27;polygon&#x27;, { points:`${zenith.x},${zenith.y} ${equator[i].x},${equator[i].y} ${equator[next].x},${equator[next].y}`, class:&#x27;pps-lift-top&#x27; });
          const bottomFace = make(&#x27;polygon&#x27;, { points:`${nadir.x},${nadir.y} ${equator[next].x},${equator[next].y} ${equator[i].x},${equator[i].y}`, class:&#x27;pps-lift-bottom&#x27; });
          faces.append(topFace, bottomFace);
          edges.append(line(equator[i], equator[next], &#x27;pps-edge&#x27;));
          edges.append(line(zenith, equator[i], &#x27;pps-seam&#x27;));
          edges.append(line(nadir, equator[i], &#x27;pps-diagonal&#x27;));
          const midpoint = { x:(equator[i].x+equator[next].x)/2, y:(equator[i].y+equator[next].y)/2 };
          nodes.append(make(&#x27;circle&#x27;, { cx:midpoint.x, cy:midpoint.y, r:14, class:&#x27;pps-node pps-active&#x27; }));
          nodes.append(textNode(midpoint.x, midpoint.y, &#x27;20&#x27;));
        }
        [zenith, nadir].forEach((apex, index) =&gt; {
          nodes.append(make(&#x27;circle&#x27;, { cx:apex.x, cy:apex.y, r:18, class:&#x27;pps-node&#x27; }));
          nodes.append(textNode(apex.x, apex.y, index===0 ? &#x27;Z&#x27; : &#x27;N&#x27;));
        });
        equator.forEach((vertex, index) =&gt; {
          nodes.append(make(&#x27;circle&#x27;, { cx:vertex.x, cy:vertex.y, r:7, class:&#x27;pps-node&#x27; }));
          nodes.append(textNode(vertex.x, vertex.y-16, `V${index}`, &#x27;pps-small&#x27;));
        });
        metrics.innerHTML = stat(&#x27;Carrier&#x27;,&#x27;7 · 15 · 10&#x27;) + stat(&#x27;Nodes&#x27;,&#x27;182&#x27;) + stat(&#x27;Full action&#x27;,&#x27;D₅ × C₂&#x27;) + stat(&#x27;Projection&#x27;,&#x27;106 + 106&#x27;);
        detail.innerHTML = &#x27;&lt;strong&gt;Two hemispheres, one carrier&lt;/strong&gt;&lt;p&gt;r⁵ = m² = h² = e. Five top and five mirrored bottom faces share one equatorial pentagon.&lt;/p&gt;&#x27;;
        result.textContent = &#x27;PENT-04 · PASS · Euler 2 · 182 glued nodes · 20 verified actions&#x27;;
      }

      function drawRoots() {
        const rootCenter = { x:270, y:285 };
        const rootRadius = 205;
        const roots = Array.from({ length:10 }, (_, i) =&gt; {
          const angle = -Math.PI / 2 + i * Math.PI / 5;
          return { x:rootCenter.x + rootRadius*Math.cos(angle), y:rootCenter.y + rootRadius*Math.sin(angle) };
        });
        const structure = make(&#x27;g&#x27;);
        const marks = make(&#x27;g&#x27;);
        svg.append(structure, marks);
        roots.forEach((rootPoint, index) =&gt; {
          structure.append(line(rootCenter, rootPoint, index%2===0 ? &#x27;pps-seam&#x27; : &#x27;pps-diagonal&#x27;));
          marks.append(make(&#x27;circle&#x27;, { cx:rootPoint.x, cy:rootPoint.y, r:index%2===0 ? 10 : 8, class:index%2===0 ? &#x27;pps-root-carrier&#x27; : &#x27;pps-root-complete&#x27; }));
        });
        structure.append(make(&#x27;circle&#x27;, { cx:rootCenter.x, cy:rootCenter.y, r:rootRadius, class:&#x27;pps-edge&#x27; }));
        marks.append(make(&#x27;circle&#x27;, { cx:rootCenter.x, cy:rootCenter.y, r:6, class:&#x27;pps-node&#x27; }));
        marks.append(textNode(rootCenter.x, 548, &#x27;H₂ · 10 equatorial roots · alternating carrier / completion&#x27;, &#x27;pps-small&#x27;));

        const axisX = 560;
        const axisTop = { x:axisX, y:170 };
        const axisBottom = { x:axisX, y:400 };
        structure.append(line(axisTop, axisBottom, &#x27;pps-seam&#x27;));
        [axisTop, axisBottom].forEach((axisRoot, index) =&gt; {
          marks.append(make(&#x27;circle&#x27;, { cx:axisRoot.x, cy:axisRoot.y, r:12, class:&#x27;pps-root-carrier&#x27; }));
          marks.append(textNode(axisRoot.x, axisRoot.y, index===0 ? &#x27;+α₃&#x27; : &#x27;−α₃&#x27;, &#x27;pps-small&#x27;));
        });
        marks.append(textNode(axisX, 438, &#x27;A₁ · 2 axial roots&#x27;, &#x27;pps-small&#x27;));
        metrics.innerHTML = stat(&#x27;Root system&#x27;,&#x27;H₂ ⊕ A₁&#x27;) + stat(&#x27;Roots&#x27;,&#x27;10 + 2&#x27;) + stat(&#x27;Group&#x27;,&#x27;D₅ × C₂&#x27;) + stat(&#x27;Orbit&#x27;,&#x27;80 → 100&#x27;);
        detail.innerHTML = &#x27;&lt;strong&gt;Root completion&lt;/strong&gt;&lt;p&gt;Five carrier rays + five antipodes + Zenith/Nadir. The system is non-crystallographic; 80 is the four-turn subtotal.&lt;/p&gt;&#x27;;
        result.textContent = &#x27;PENT-05 · PASS · rank 3 · 12 roots · reflection group order 20&#x27;;
      }

      function drawCycle(centerPoint, ringRadius, count, label) {
        const ring = make(&#x27;g&#x27;);
        const points = Array.from({ length:count }, (_, index) =&gt; {
          const angle = -Math.PI/2 + index*2*Math.PI/count;
          return { x:centerPoint.x + ringRadius*Math.cos(angle), y:centerPoint.y + ringRadius*Math.sin(angle) };
        });
        points.forEach((point, index) =&gt; {
          ring.append(line(point, points[(index+1)%count], &#x27;pps-control-ring&#x27;));
          ring.append(line(centerPoint, point, &#x27;pps-control-spoke&#x27;));
          ring.append(make(&#x27;circle&#x27;, { cx:point.x, cy:point.y, r:3.5, class:&#x27;pps-node&#x27; }));
        });
        ring.append(make(&#x27;circle&#x27;, { cx:centerPoint.x, cy:centerPoint.y, r:5, class:&#x27;pps-active&#x27; }));
        ring.append(textNode(centerPoint.x, centerPoint.y + ringRadius + 18, label, &#x27;pps-small&#x27;));
        svg.append(ring);
      }

      function drawGrowth() {
        const closed = growthStep === &#x27;closed&#x27;;
        const faces = closed ? 5 : Number(growthStep);
        const fanCenter = { x:230, y:285 };
        const fanRadius = 210;
        const rays = Array.from({ length:faces + 1 }, (_, index) =&gt; {
          const angle = (-210 + index*60) * Math.PI/180;
          return { x:fanCenter.x + fanRadius*Math.cos(angle), y:fanCenter.y + fanRadius*Math.sin(angle) };
        });
        const layers = make(&#x27;g&#x27;);
        const edges = make(&#x27;g&#x27;);
        const marks = make(&#x27;g&#x27;);
        svg.append(layers, edges, marks);

        if (closed) {
          for (let index=0; index&lt;5; index++) {
            const a = vertices[index];
            const b = vertices[(index+1)%5];
            layers.append(make(&#x27;polygon&#x27;, { points:`${center.x},${center.y} ${a.x},${a.y} ${b.x},${b.y}`, class:&#x27;pps-growth-face&#x27; }));
            edges.append(line(center, a, &#x27;pps-seam&#x27;));
            edges.append(line(a, b, &#x27;pps-edge&#x27;));
          }
          marks.append(make(&#x27;circle&#x27;, { cx:center.x, cy:center.y, r:16, class:&#x27;pps-ok&#x27; }));
          marks.append(textNode(center.x, center.y, &#x27;106&#x27;));
          marks.append(textNode(center.x, 548, &#x27;closure: 112 − 6 identified seam nodes = 106&#x27;, &#x27;pps-small&#x27;));
        } else {
          for (let index=0; index&lt;faces; index++) {
            layers.append(make(&#x27;polygon&#x27;, { points:`${fanCenter.x},${fanCenter.y} ${rays[index].x},${rays[index].y} ${rays[index+1].x},${rays[index+1].y}`, class:&#x27;pps-growth-face&#x27; }));
            edges.append(line(rays[index], rays[index+1], &#x27;pps-edge&#x27;));
          }
          rays.forEach((ray, index) =&gt; edges.append(line(fanCenter, ray, index===0 || index===faces ? &#x27;pps-diagonal&#x27; : &#x27;pps-seam&#x27;)));
          marks.append(make(&#x27;circle&#x27;, { cx:fanCenter.x, cy:fanCenter.y, r:16, class:&#x27;pps-node&#x27; }));
          marks.append(textNode(fanCenter.x, fanCenter.y, String(21*faces+7)));
          marks.append(textNode(fanCenter.x, 548, `${faces} face${faces===1?&#x27;&#x27;:&#x27;s&#x27;} · open radial seams remain state`, &#x27;pps-small&#x27;));
        }

        if (!closed) {
          drawCycle({x:530,y:165}, 50, 5, &#x27;C₅&#x27;);
          drawCycle({x:530,y:300}, 50, 6, &#x27;C₆ A&#x27;);
          drawCycle({x:530,y:435}, 50, 6, &#x27;C₆ B&#x27;);
          svg.append(textNode(530, 520, &#x27;historical control: hub-coupled&#x27;, &#x27;pps-small&#x27;));
        }

        const nodeCount = closed ? 106 : 21*faces+7;
        const boundaryCount = closed ? 5 : faces+2;
        metrics.innerHTML = stat(&#x27;Faces&#x27;, String(faces)) + stat(&#x27;Nodes&#x27;, String(nodeCount)) + stat(&#x27;Boundary edges&#x27;, String(boundaryCount)) + stat(&#x27;Euler χ&#x27;, &#x27;1&#x27;);
        detail.innerHTML = closed
          ? &#x27;&lt;strong&gt;Closure is an operation&lt;/strong&gt;&lt;p&gt;The last radial seam identifies six non-apex nodes. The outer pentagon remains the single boundary component.&lt;/p&gt;&#x27;
          : &#x27;&lt;strong&gt;Boundary is state&lt;/strong&gt;&lt;p&gt;Each attachment consumes one open radial edge, adds 21 nodes and exposes one net additional boundary edge.&lt;/p&gt;&#x27;;
        result.textContent = closed
          ? &#x27;PENT-06 · PASS WITH BOUNDARY · closed five-face carrier recovered&#x27;
          : &#x27;PENT-06 · PASS · open growth state · C₅+C₆+C₆ retained as separate hub control&#x27;;
      }

      function drawCoupling() {
        const couplingCenter = { x:325, y:270 };
        const phaseRadius = 225;
        const addressRadius = 165;
        const phase = make(&#x27;g&#x27;);
        const cycles = make(&#x27;g&#x27;);
        const marks = make(&#x27;g&#x27;);
        svg.append(phase, cycles, marks);
        phase.append(make(&#x27;circle&#x27;, { cx:couplingCenter.x, cy:couplingCenter.y, r:phaseRadius, class:&#x27;pps-control-ring&#x27; }));
        for (let tick=0; tick&lt;30; tick++) {
          const angle = -Math.PI/2 + tick*2*Math.PI/30;
          const point = { x:couplingCenter.x + phaseRadius*Math.cos(angle), y:couplingCenter.y + phaseRadius*Math.sin(angle) };
          phase.append(make(&#x27;circle&#x27;, { cx:point.x, cy:point.y, r:tick===0 ? 5 : 2, class:tick===0 ? &#x27;pps-active&#x27; : &#x27;pps-node&#x27; }));
        }
        const drawTypedCycle = (count, ringRadius, edgeClass, label) =&gt; {
          const points = Array.from({ length:count }, (_, index) =&gt; {
            const angle = -Math.PI/2 + index*2*Math.PI/count;
            return { x:couplingCenter.x + ringRadius*Math.cos(angle), y:couplingCenter.y + ringRadius*Math.sin(angle) };
          });
          points.forEach((point, index) =&gt; {
            cycles.append(line(point, points[(index+1)%count], edgeClass));
            marks.append(make(&#x27;circle&#x27;, { cx:point.x, cy:point.y, r:index===0 ? 7 : 4, class:index===0 ? &#x27;pps-active&#x27; : &#x27;pps-node&#x27; }));
          });
          marks.append(textNode(couplingCenter.x + ringRadius + 28, couplingCenter.y, label, &#x27;pps-small&#x27;));
        };
        drawTypedCycle(5, 190, &#x27;pps-seam&#x27;, &#x27;C₅&#x27;);
        cycles.append(make(&#x27;circle&#x27;, { cx:couplingCenter.x, cy:couplingCenter.y, r:addressRadius, class:&#x27;pps-address-ring&#x27; }));
        for (let index=0; index&lt;5; index++) {
          const angle=-Math.PI/2+index*2*Math.PI/5;
          const outer={x:couplingCenter.x+190*Math.cos(angle),y:couplingCenter.y+190*Math.sin(angle)};
