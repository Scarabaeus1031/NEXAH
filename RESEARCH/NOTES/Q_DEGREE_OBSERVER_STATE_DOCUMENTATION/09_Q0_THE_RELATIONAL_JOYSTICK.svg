<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <radialGradient id="bg" cx="50%" cy="47%" r="75%">
      <stop offset="0" stop-color="#173b4d"/>
      <stop offset=".48" stop-color="#0a2232"/>
      <stop offset="1" stop-color="#06131f"/>
    </radialGradient>
    <radialGradient id="hub">
      <stop offset="0" stop-color="#f2b84b" stop-opacity=".46"/>
      <stop offset=".72" stop-color="#cc8025" stop-opacity=".16"/>
      <stop offset="1" stop-color="#cc8025" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .sans { font-family: Inter, Arial, Helvetica, sans-serif; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .label { font: 500 21px Inter, Arial, sans-serif; letter-spacing: 5px; fill: #9bb0bd; }
      .eq { font: 38px Georgia, "Times New Roman", serif; fill: #f4efe5; }
      .small { font: 23px Inter, Arial, sans-serif; fill: #a9bac4; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="800" y="67" text-anchor="middle" class="sans" font-size="21" letter-spacing="8" fill="#9bb0bd">NEXAH · OPERATOR PLATE</text>
  <text x="800" y="122" text-anchor="middle" class="sans" font-size="46" font-weight="500" letter-spacing="7" fill="#f4efe5">Q° — THE RELATIONAL JOYSTICK</text>
  <text x="800" y="160" text-anchor="middle" class="sans" font-size="23" fill="#9bb0bd">Quaternion state · relational control · normalized range</text>

  <line x1="800" y1="205" x2="800" y2="802" stroke="#607987" stroke-opacity=".46" stroke-width="2"/>

  <text x="405" y="225" text-anchor="middle" class="label">FIVE-LEAF VIEW</text>
  <g transform="translate(405 470)">
    <ellipse cx="0" cy="-145" rx="85" ry="120" fill="#153449" stroke="#577181" stroke-width="2"/>
    <ellipse cx="160" cy="0" rx="120" ry="85" fill="#153449" stroke="#577181" stroke-width="2"/>
    <ellipse cx="0" cy="145" rx="85" ry="120" fill="#153449" stroke="#577181" stroke-width="2"/>
    <ellipse cx="-160" cy="0" rx="120" ry="85" fill="#153449" stroke="#577181" stroke-width="2"/>
    <line x1="-230" y1="0" x2="230" y2="0" stroke="#6c8390" stroke-opacity=".5" stroke-width="2"/>
    <line x1="0" y1="-235" x2="0" y2="235" stroke="#6c8390" stroke-opacity=".5" stroke-width="2"/>
    <text x="0" y="-170" text-anchor="middle" class="serif" font-size="44" fill="#f4efe5">1</text>
    <text x="182" y="14" text-anchor="middle" class="serif" font-size="44" fill="#f4efe5">i</text>
    <text x="0" y="192" text-anchor="middle" class="serif" font-size="44" fill="#f4efe5">j</text>
    <text x="-182" y="14" text-anchor="middle" class="serif" font-size="44" fill="#f4efe5">k</text>
    <circle cx="0" cy="0" r="102" fill="url(#hub)" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="76" fill="#523715" stroke="#f2b84b" stroke-width="3"/>
    <text x="0" y="13" text-anchor="middle" class="serif" font-size="45" fill="#fff0ca">𝒬°</text>
    <text x="0" y="47" text-anchor="middle" class="sans" font-size="16" letter-spacing="3" fill="#d8c29c">OPERATOR</text>
  </g>
  <text x="405" y="750" text-anchor="middle" class="eq">q = a + bi + cj + dk</text>
  <text x="405" y="795" text-anchor="middle" class="small">State ≠ operator · 𝒬° is not a fifth component</text>

  <text x="1190" y="225" text-anchor="middle" class="label">THREE-LIFT VIEW</text>
  <g transform="translate(0 5)">
    <rect x="970" y="290" width="34" height="410" rx="17" fill="#17344a" stroke="#607987" stroke-width="2"/>
    <rect x="1376" y="290" width="34" height="410" rx="17" fill="#17344a" stroke="#607987" stroke-width="2"/>
    <line x1="1004" y1="342" x2="1376" y2="342" stroke="#607987" stroke-width="2"/>
    <line x1="1004" y1="650" x2="1376" y2="650" stroke="#607987" stroke-width="2"/>
    <text x="1190" y="326" text-anchor="middle" class="serif" font-size="31" fill="#a9bac4">S = R − L</text>
    <line x1="1190" y1="370" x2="1190" y2="622" stroke="#4cb4dc" stroke-width="23" stroke-linecap="round" filter="url(#glow)"/>
    <line x1="1024" y1="496" x2="1356" y2="496" stroke="#607987" stroke-width="2" stroke-dasharray="8 10"/>
    <circle cx="1190" cy="496" r="55" fill="#523715" stroke="#f2b84b" stroke-width="4"/>
    <text x="1190" y="510" text-anchor="middle" class="serif" font-size="40" fill="#fff0ca">ξQ</text>
    <text x="954" y="505" text-anchor="end" class="serif" font-size="28" fill="#a9bac4">−1</text>
    <text x="1426" y="505" class="serif" font-size="28" fill="#a9bac4">+1</text>
    <text x="987" y="744" text-anchor="middle" class="serif" font-size="28" fill="#a9bac4">L</text>
    <text x="1393" y="744" text-anchor="middle" class="serif" font-size="28" fill="#a9bac4">R</text>
  </g>
  <text x="1190" y="795" text-anchor="middle" class="serif" font-size="34" fill="#f4efe5">ξQ = 2(x − L)/(R − L) − 1</text>

  <path d="M198 865 C462 818 622 911 800 864 C981 817 1126 910 1402 856"
        fill="none" stroke="#4cb4dc" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M198 865 C462 818 622 911 800 864 C981 817 1126 910 1402 856"
        fill="none" stroke="#f2b84b" stroke-width="1.5" stroke-linecap="round"/>
  <text x="800" y="927" text-anchor="middle" class="sans" font-size="22" letter-spacing="3" fill="#f4efe5">
    q = STATE  ·  𝒬° = OPERATOR  ·  ξQ = CONTROL  ·  wᵢ = WEIGHT  ·  Δq = CHANGE
  </text>
  <text x="800" y="968" text-anchor="middle" class="sans" font-size="19" fill="#9bb0bd">
    Four basis elements · one relational controller · no fifth quaternion dimension claimed
  </text>
</svg>
