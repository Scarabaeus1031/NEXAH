exclusions:
  - generic duality, opposition, reversal, or symmetry without a preserved relation
  - automatic inverse or reverse graph edge
  - identity equivalence with Janus Bridge
  - identity equivalence with Janus Directional Coherence Operator
  - physical law, quantum framework, universal geometry, or causal mechanism
  - automatic inheritance of historical symbolic or visual claims
open_questions:
  - What makes perspectives complementary rather than merely different?
  - Must JANUS involve a shared interface?
  - Is information loss essential or Bridge-specific?
  - When does bidirectional analysis instantiate JANUS?
  - Which invariants should a future Janus Bridge preserve?
  - Should a broader Concept eventually receive an identity separate from NX-OP-0016?
  - Which research findings survive independent baselines and domain tests?
