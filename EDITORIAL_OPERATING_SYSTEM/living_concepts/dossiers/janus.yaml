  - decision_id: X1-JANUS-06
    question: Expose JANUS through a Kernel Concept overlay now?
    recommendation: defer_until_five_dossiers_reviewed
recommendation:
  outcome: proceed_without_identity_allocation
  rationale: >-
    JANUS is sufficiently specific and provenance-rich for an X1 Concept
    proposal, but permanent Operator-Concept identity policy should be decided
    only after all five dossiers expose the shared modeling requirements.
warnings:
  - This dossier does not change NX-OP-0016 or any Registry record.
  - Proposed relations are not graph edges.
  - X1 did not independently rerun or validate the complete JANUS experimental series.
  - Historical occurrence establishes lineage, not validity.
