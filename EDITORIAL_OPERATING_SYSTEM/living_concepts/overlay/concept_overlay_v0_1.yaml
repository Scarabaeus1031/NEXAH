question_bindings:
  - question_id: CFQ-01
    question: What is Transition Geometry?
    focus: concept:transition-geometry
    basis:
      concept_refs: [concept:transition-geometry]
      occurrence_refs: [OCC-TG-001, OCC-TG-002]
      relation_refs: []
      path_refs: []
    expected_result: pass
    reader_answer: >-
      Transition Geometry is NEXAH's way of describing the structured
      in-between through declared relations, boundaries, apertures, paths, and
      constraints. It is a family of representations, not one universal space.
    explain_disclosures:
      - declared_representation_not_reality
      - representation_independent_transition_space_not_supported

  - question_id: CFQ-02
    question: How is JANUS related to Transition Geometry?
    focus: concept:janus
    basis:
      concept_refs: [concept:transition-geometry, concept:janus]
      occurrence_refs: [OCC-TG-001, OCC-JANUS-001]
      relation_refs: [REL-TG-JANUS-001]
      path_refs: []
    expected_result: pass
    reader_answer: >-
      Transition Geometry describes a possible passage. JANUS helps inspect
      that passage from complementary sides without collapsing them into one
      view. They are related but distinct roles.
    explain_disclosures:
      - relation_is_review_only
      - janus_identity_layers_remain_distinct

  - question_id: CFQ-03
    question: Where is the Inbetween developed?
    focus: concept:inbetween
    basis:
      concept_refs: [concept:inbetween, concept:transition-geometry]
      occurrence_refs: [OCC-INB-001, OCC-INB-002, OCC-INB-003, OCC-TG-001]
      relation_refs: []
      path_refs: [PATH-INBETWEEN-001]
    expected_result: pass_with_editorial_synthesis
    reader_answer: >-
      Follow the idea from GEOMETRIA NOVA through THE INBETWEEN, THE THRESHOLD,
      THE JANUS GATE, THE SPACE BETWEEN, THE RELATION TUBE, APERTURE =
      TRANSFORMATIONSRAUM, and THE CARTOGRAPHY LABORATORY.
    explain_disclosures:
      - route_is_human_curated
      - no_canonical_inbetween_identity

  - question_id: CFQ-04
    question: Show me the path from Boundary to Transition.
    focus: concept:transition-geometry
    basis:
      concept_refs: [concept:boundary, concept:aperture, concept:inbetween, concept:transition]
      occurrence_refs: [OCC-BND-001, OCC-TRN-001, OCC-TG-001]
      relation_refs: []
      path_refs: [PATH-BOUNDARY-TRANSITION-001]
    expected_result: pass_with_editorial_synthesis
    reader_answer: >-
      Difference leads to Boundary, then Opening or Aperture, Threshold,
      Inbetween or Passage, Transition, and finally a New State, Return, or
      Block.
    explain_disclosures:
      - path_is_human_curated_not_a_graph_edge
      - path_is_not_a_deterministic_state_machine
      - core_recurrence_remains_a_hypothesis

  - question_id: CFQ-05
    question: Which Works explain Aperture Geometry?
    focus: concept:aperture
    basis:
      concept_refs: [concept:aperture]
      occurrence_refs: [OCC-APT-001, OCC-APT-002, OCC-INB-001, OCC-INB-003, OCC-TG-001]
      relation_refs: [REL-TG-APT-001]
      path_refs: [PATH-APERTURE-READING-001]
    expected_result: pass
    reader_answer: >-
      Begin with THE OPERATOR, continue through the Whiteboards and THE DUAL
      SPINE, then use THE CARTOGRAPHY LABORATORY and OPERATIONAL GEOMETRY OF
      TRANSITION; use the Aperture Geometry Research note for the stricter
      evidence boundary.
    explain_disclosures:
      - operator_record_remains_authoritative
      - work_explanation_is_distinct_from_research_support

  - question_id: CFQ-06
    question: What does Balance mean in NEXAH?
    focus: concept:balance
    basis:
      concept_refs: [concept:balance]
      occurrence_refs: [OCC-BAL-001, OCC-BAL-002, OCC-BAL-003]
      relation_refs: []
      path_refs: []
    expected_result: pass_with_concept_boundary
    reader_answer: >-
      Balance is not one fixed NEXAH geometry. It describes several related
      ways in which different tendencies remain in a viable relation without
      one simply erasing the other.
    explain_disclosures:
      - outcome_is_multiple_related_models
      - no_balance_concept_identity_or_graph_edge
      - balance_remains_distinct_from_adjacent_terms

