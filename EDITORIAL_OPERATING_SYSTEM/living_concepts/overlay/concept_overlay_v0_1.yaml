phase: X1
status: human_review_required
canonical: false
load_policy: manual_evaluation_only
created_at: '2026-07-16'
authority:
  modifies_registry: false
  allocates_identities: false
  modifies_operators: false
  creates_canonical_graph_edges: false
  modifies_kernel: false
  writes_to_arena: false
  inference_from_cooccurrence: prohibited
model:
  concept_handle: local_review_reference_or_existing_operator_profile
  occurrence: documentary_evidence_not_claim_validation
  relation: typed_review_proposal_with_provenance
  path: human_curated_documentary_route
  question_binding: reviewed_answer_contract_not_general_inference

concepts:
  - handle: concept:transition-geometry
    preferred_name: Transition Geometry
    kind: concept_family
    identity_state: local_review_handle
    review_state: reviewed_proposal
    maturity: coherent
    reader_definition: >-
      NEXAH's way of describing the structured in-between: the relations,
      boundaries, apertures, paths, and constraints through which one state
      may become another.
    definition_status: human_approved_reader_baseline_noncanonical
    review_source: EDITORIAL_OPERATING_SYSTEM/living_concepts/review/transition_geometry/TRANSITION_GEOMETRY_FAMILY_REVIEW.md
    boundaries:
      - declared_representation_not_reality
      - representation_independent_transition_space_not_supported
      - visual_recurrence_does_not_establish_invariant

  - handle: concept:janus
    preferred_name: JANUS
    kind: concept
    identity_state: local_review_handle_with_existing_operator_expression
    review_state: proposal
    maturity: coherent
    reader_definition: >-
      The principle that one situation may require complementary perspectives
      whose relation must be preserved rather than collapsed into a single
      view.
    definition_status: proposal_from_dossier
    existing_operator_ref: NX-OP-0016
    review_source: EDITORIAL_OPERATING_SYSTEM/living_concepts/dossiers/JANUS_DOSSIER.md
    boundaries:
      - principle_is_distinct_from_controlled_operator
      - janus_bridge_is_planned_and_distinct
      - directional_coherence_operator_is_experimental_and_method_specific

  - handle: concept:aperture
    preferred_name: Aperture
    kind: existing_operator_profile
    identity_state: bound_to_existing_operator
    review_state: controlled_operator_authoritative
    maturity: core_operator_with_broader_research_profile
    existing_operator_ref: NX-OP-0002
    definition_ref: LIBRARY/registry/concepts/NX-OP-0002.yaml
    profile_note: >-
      The controlled selective-opening definition remains authoritative.
      Research additionally examines where transitions can occur without
      making access identical to activation or directional organization.
    research_source: RESEARCH/CORE_CONCEPTS/aperture_geometry.md
    boundaries:
      - no_new_concept_identity
      - access_is_distinct_from_activation
      - work_taxonomies_do_not_expand_operator_registry

  - handle: concept:inbetween
    preferred_name: Inbetween
    kind: concept_lead
    identity_state: local_review_handle
    review_state: path_supported_not_identity_reviewed
    maturity: developing
    reader_definition: >-
      The represented relational space in which separation, threshold,
      passage, and reconfiguration become inspectable.
    definition_status: editorial_synthesis_for_path_test
    review_source: EDITORIAL_OPERATING_SYSTEM/living_concepts/review/transition_geometry/TRANSITION_GEOMETRY_FAMILY_REVIEW.md
    boundaries:
      - no_canonical_definition
      - no_concept_identity
      - meaning_is_distributed_across_works

  - handle: concept:boundary
    preferred_name: Boundary
    kind: existing_operator_profile
    identity_state: bound_to_existing_operator
    review_state: controlled_operator_authoritative
    maturity: core_operator
    existing_operator_ref: NX-OP-0006
    definition_ref: LIBRARY/registry/concepts/NX-OP-0006.yaml
    boundaries:
      - no_new_concept_identity
      - solver_sampling_structural_passage_and_validity_boundaries_are_not_equivalent

  - handle: concept:transition
    preferred_name: Transition
    kind: existing_operator_profile
    identity_state: bound_to_existing_operator
    review_state: controlled_operator_authoritative
    maturity: core_operator
    existing_operator_ref: NX-OP-0005
    definition_ref: LIBRARY/registry/concepts/NX-OP-0005.yaml
    boundaries:
      - no_new_concept_identity
      - transition_operator_is_narrower_than_transition_geometry_family

  - handle: concept:balance
    preferred_name: Balance
    kind: concept_family_lead
    identity_state: local_review_handle
    review_state: reviewed_non_unified
    maturity: multiple_related_models
    reader_definition: >-
      Different directions, forces, or forms of motion may remain in a viable
      relation without one simply erasing the other; current NEXAH sources use
      several related Balance models rather than one fixed geometry.
    definition_status: comparison_summary_not_canonical_definition
    review_source: EDITORIAL_OPERATING_SYSTEM/living_concepts/review/geometry_of_balance/GEOMETRY_OF_BALANCE_EVIDENCE_REVIEW.md
    boundaries:
      - no_single_balance_concept
      - balance_is_not_identical_to_equilibrium
      - balance_is_not_identical_to_stability_closure_coherence_or_resonance
      - figure_eight_and_olgo_are_realizations_or_motifs_not_definitions

