positive_sequences:
  - sequence_id: S1
    work_id: W1
    title: Operation 04 - Projection
    adjacency_kind: explicitly_ordered_units_within_single_spread
    source_span:
      arena_channel_id: 5391199
      block_id: 47527770
      channel_position: 49
    units:
      - reference_id: S1-U1
        order: 1
        title: Arrival - Landscape
      - reference_id: S1-U2
        order: 2
        title: Contrast - Whiteboard
      - reference_id: S1-U3
        order: 3
        title: Projection - Blackboard
      - reference_id: S1-U4
        order: 4
        title: Connection - One Page
      - reference_id: S1-U5
        order: 5
        title: Observation - One Question
    mechanisms:
      M1_bounded_representations: true
      M2_simultaneous_availability: strong_co_presence
      M3_memory: structural_memory
      M4_relational_operations:
        - contrast
        - projection
        - translation
        - recontextualization
      M4_evidence: >-
        Landscape, geometric construction, five domain translations,
        connection statements, and the final question all preserve the same
        operation while changing representational form.
      M5_reflection: explicit_reflection
      M6_reorientation: clear_reorientation
      M7_representational_emergence:
        - new_observer_frame
        - new_question_as_representation
      M7_evidence: >-
        The sequence makes a reusable frame available in which every view can
        be evaluated for what it preserves, loses, and reveals.
      M8_without_plate: "yes"
    outcome: full_reflective_representation_cycle
    boundary: Local chapter mechanism; no claim that adjacent chapters accumulate in the same way.
    reader_reconstruction:
      first_encounters: a landscape whose appearance depends on position
      foregrounds: situated and partial vision
      second_view: translates the landscape into point-plane-image geometry
      retained_through: co-presence of all five units and repetition of one operation
      comparison_reveals: fidelity and completeness are different
      position_changes: the observer becomes part of evaluating a projection
      result: a new observer frame and a reusable loss/revelation question

  - sequence_id: S2
    work_id: W2
    title: Maps to models to cycle to ecosystem
    adjacency_kind: adjacent_public_boards
    source_span:
      arena_channel_id: 5305692
      position_start: 10
      position_end: 7
    units:
      - {reference_id: S2-U1, order: 1, position: 10, block_id: 47005290, title: 03 Why Maps Matter}
      - {reference_id: S2-U2, order: 2, position: 9, block_id: 47005284, title: 04 From Models to Maps}
      - {reference_id: S2-U3, order: 3, position: 8, block_id: 47005282, title: 05 The NEXAH Cycle}
      - {reference_id: S2-U4, order: 4, position: 7, block_id: 47005286, title: 06 The NEXAH Ecosystem}
    mechanisms:
      M1_bounded_representations: true
      M2_simultaneous_availability: partial_co_presence
      M3_memory: structural_memory
      M4_relational_operations:
        - comparison
        - translation
        - integration
        - recontextualization
      M4_evidence: >-
        Historical map forms become a model-map distinction, then an iterative
        activity cycle, then differentiated institutional and reader paths.
      M5_reflection: explicit_reflection
      M6_reorientation: clear_reorientation
      M7_representational_emergence:
        - new_relational_structure
      M7_evidence: >-
        The ecosystem map reorganizes categories developed by the three
        preceding boards rather than functioning only as an isolated poster.
      M8_without_plate: "yes"
    outcome: full_reflective_representation_cycle
    boundary: Memory is structural rather than an explicit return to every prior board.
    reader_reconstruction:
      first_encounters: historically different maps with a shared orienting purpose
      foregrounds: partiality without uselessness
      second_view: contrasts explanatory models with orienting maps
      retained_through: repeated icons, categories, and map vocabulary
      comparison_reveals: orientation is coordinated activity rather than one artifact
      position_changes: the reader can select differentiated roles and paths
      result: an ecosystem map as a new relational structure

  - sequence_id: S3
    work_id: W3
    title: Map to Inbetween to Threshold to Janus to Exchange to Web
    adjacency_kind: adjacent_public_boards
    source_span:
      arena_channel_id: 5345285
      position_start: 16
      position_end: 11
    units:
      - {reference_id: S3-U1, order: 1, position: 16, block_id: 47227440, title: 11 The Map - Das gesamte Bild}
      - {reference_id: S3-U2, order: 2, position: 15, block_id: 47227437, title: 11 The Inbetween}
      - {reference_id: S3-U3, order: 3, position: 14, block_id: 47227435, title: 12 The Threshold}
      - {reference_id: S3-U4, order: 4, position: 13, block_id: 47227434, title: 13 The Janus Gate}
      - {reference_id: S3-U5, order: 5, position: 12, block_id: 47227433, title: 14 The Exchange}
      - {reference_id: S3-U6, order: 6, position: 11, block_id: 47227432, title: 15 The Web}
    mechanisms:
      M1_bounded_representations: true
      M2_simultaneous_availability: strong_co_presence
      M3_memory: explicit_memory
      M4_relational_operations:
        - overlap
        - translation
        - recontextualization
        - integration
        - return
      M4_evidence: >-
        World A and World B remain distinct while overlap becomes threshold,
        reciprocal gate, transformed exchange, feedback, and finally Web.
      M5_reflection: explicit_reflection
      M6_reorientation: clear_reorientation
      M7_representational_emergence:
        - revised_map
        - new_relational_structure
      M7_evidence: >-
        The Web revises the earlier whole-system map by retaining worlds while
        making transformed relationships and feedback constitutive of the whole.
      M8_without_plate: "yes"
    outcome: full_reflective_representation_cycle
    boundary: Editorial model only; not a law of reality.
    reader_reconstruction:
      first_encounters: a whole-system map assembled from prior views
      foregrounds: a living system of differentiated parts
      second_view: challenges the whole with two distinct worlds and an overlap
      retained_through: the cumulative Big Picture icon chain on every board
      comparison_reveals: relations and feedback are active structures
      position_changes: the reader moves from viewing nodes to navigating relations
      result: a revised map of the Web as a many-perspective whole

  - sequence_id: S4
    work_id: W4
    title: Disciplinary maps to translation layer
    adjacency_kind: adjacent_public_boards
    source_span:
      arena_channel_id: 5250350
      position_start: 12
      position_end: 8
    units:
      - {reference_id: S4-U1, order: 1, position: 12, block_id: 46658887, title: 06 Cognitive Mapping and NEXAH}
      - {reference_id: S4-U2, order: 2, position: 11, block_id: 46658885, title: 07 Visualization and NEXAH}
      - {reference_id: S4-U3, order: 3, position: 10, block_id: 46658884, title: 08 Power Systems and NEXAH}
      - {reference_id: S4-U4, order: 4, position: 9, block_id: 46658894, title: "09 Where Does NEXAH Live?"}
      - {reference_id: S4-U5, order: 5, position: 8, block_id: 46658968, title: The Cartography Laboratory Overview}
    mechanisms:
      M1_bounded_representations: true
      M2_simultaneous_availability: partial_co_presence
      M3_memory: structural_memory
      M4_relational_operations:
        - comparison
        - translation
        - integration
        - recontextualization
      M4_evidence: >-
        Three disciplinary translations retain a common grammar before a
        scientific landscape explicitly compares them and a laboratory map
        recontextualizes their intersection as practice.
      M5_reflection: explicit_reflection
      M6_reorientation: clear_reorientation
      M7_representational_emergence:
        - new_relational_structure
        - new_observer_frame
      M7_evidence: >-
        NEXAH becomes a translation and navigation layer between maps, and the
        reader is positioned as cartographer rather than owner of a total map.
      M8_without_plate: "yes"
    outcome: full_reflective_representation_cycle
    boundary: Integrative emergence is less explicit than S3 and draws on the broader boards 01-08.
    reader_reconstruction:
      first_encounters: cognitive mapping as a family of internal maps
      foregrounds: perspective, decision, and action
      second_view: translates mapping into visualization and then a concrete power-system domain
      retained_through: repeated disciplinary templates and map vocabulary
      comparison_reveals: NEXAH occupies relations between disciplines rather than one discipline
      position_changes: the reader becomes a cartographer between maps
      result: a translation-layer map and Cartography Laboratory overview

