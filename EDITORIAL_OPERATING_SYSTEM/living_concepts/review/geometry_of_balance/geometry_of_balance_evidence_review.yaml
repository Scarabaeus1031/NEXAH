reader_answer:
  value: >-
    Balance is not one fixed NEXAH geometry. Across the Library it usually
    means that different directions, forces, or forms of motion remain in a
    viable relation without one simply erasing the other. Some Works show this
    as a figure-eight, paired JANUS axes, a Relation Tube, or OLGO regulation.
    These are related models, not yet one canonical Concept.
  status: proposal_after_human_approval
