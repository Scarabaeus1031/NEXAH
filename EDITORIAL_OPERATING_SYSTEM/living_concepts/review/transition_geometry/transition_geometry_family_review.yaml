reader_definition:
  value: >-
    Transition Geometry is NEXAH's way of describing the structured
    in-between: the relations, boundaries, apertures, paths, and constraints
    through which one state may become another.
  status: proposal_for_human_review
governing_boundary:
  geometry_is: a declared relational representation
  geometry_is_not: the represented reality itself
  universal_transition_space: not_supported
  supported_scope: >-
    A family of representation-specific states, relations, paths, fields,
    graphs, campaigns, episodes, and explicit boundaries.
role_model:
  - role: transition_geometry
    function: describes_the_structured_inbetween
  - role: atlas_reconstruction
    function: maps_basins_corridors_gates_bottlenecks_recovery_and_anchors
  - role: janus
    function: preserves_and_evaluates_complementary_sides_of_a_passage
family_members:
  - key: state_geometry
    question: What states or regimes are represented?
    forms: [region, basin, attractor, frame]
    review_state: coherent_family_member
  - key: relation_geometry
    question: What is connected to what?
    forms: [edge, tube, bridge, network, coupling]
    review_state: coherent_family_member
  - key: flow_geometry
    question: How does movement develop?
    forms: [field, gradient, drift, corridor, vortex]
    review_state: coherent_in_scoped_representations
  - key: boundary_geometry
    question: What distinguishes or limits a region?
    forms: [membrane, cut, horizon, constraint]
    review_state: coherent_but_boundary_types_must_remain_distinct
  - key: aperture_geometry
    question: Where can passage occur?
    forms: [gate, opening, threshold, bottleneck]
    review_state: strong_research_and_work_evidence
  - key: observer_geometry
    question: What becomes visible from a declared view?
    forms: [projection, slice, scale, reference, blind_spot]
    review_state: coherent_conceptual_family_member
  - key: recovery_geometry
    question: How can a system return or restabilize?
    forms: [anchor, return_path, resilient_region]
    review_state: authored_atlas_layer_support_varies
  - key: resonance_geometry
    question: How do oscillations or relations align?
    forms: [wave, phase, loop, coherence]
    review_state: strong_work_vocabulary_broad_physical_claims_unverified
  - key: balance_geometry
    question: How are complementary directions held in relation?
    forms: [figure_eight, counterflow, hinge, dynamic_balance]
    review_state: human_lead_definition_required
