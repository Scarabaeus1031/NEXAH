tests:
  - id: CFQ-01
    question: What is Transition Geometry?
    result: pass
    reader_answer: >-
      Transition Geometry is NEXAH's way of describing the structured
      in-between: the relations, boundaries, apertures, paths, and constraints
      through which one state may become another. It is a family of declared
      representations, not one universal space.
    reader_route:
      - {title: THE CARTOGRAPHY LABORATORY, arena_channel_id: 5386766}
      - {title: GEOMETRIA NOVA, arena_channel_id: 5442781}
      - {title: OPERATIONAL GEOMETRY OF TRANSITION, arena_channel_id: 5217666}
    explain_disclosures:
      - geometry_is_a_declared_relational_representation
      - representation_independent_transition_space_not_supported
      - work_equations_are_not_automatically_implemented_methods
    evidence:
      - EDITORIAL_OPERATING_SYSTEM/living_concepts/review/transition_geometry/TRANSITION_GEOMETRY_FAMILY_REVIEW.md
      - ARCHITECTURE/orientation_layer/STATE_TRANSITION_ORIENTATION_REVIEW.md
      - ARCHITECTURE/METHODS.md
  - id: CFQ-02
    question: How is JANUS related to Transition Geometry?
    result: pass
    reader_answer: >-
      Transition Geometry describes a possible passage. JANUS helps inspect
      that passage from complementary sides without collapsing them into one
      view. JANUS, Atlas Reconstruction, and Geometry of Transition remain
      distinct roles.
    reader_route:
      - EDITORIAL_OPERATING_SYSTEM/living_concepts/dossiers/JANUS_DOSSIER.md
      - {title: THE CARTOGRAPHY LABORATORY, arena_channel_id: 5386766}
    explain_disclosures:
      - relation_is_review_proposal_not_graph_edge
      - janus_principle_is_distinct_from_NX-OP-0016
      - janus_bridge_is_planned_and_distinct
      - directional_coherence_operator_is_experimental_and_method_specific
