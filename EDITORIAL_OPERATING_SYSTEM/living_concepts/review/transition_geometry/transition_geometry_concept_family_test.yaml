  - id: CFQ-06
    question: What does Balance mean in NEXAH?
    result: pass_with_concept_boundary
    reader_answer: >-
      Balance is not one fixed NEXAH geometry. It usually means that different
      directions, forces, or forms of motion remain in a viable relation
      without one simply erasing the other. Figure-eight, paired JANUS axes,
      Relation Tube, and OLGO are related models, not one canonical Concept.
    reader_route:
      - {title: THE DUAL SPINE, arena_channel_id: 5345385, role: relational_balance}
      - {title: LIBRARYBOOK, arena_channel_id: 5413103, role: directional_balance}
      - {title: THE OPERATOR LIBRARY, arena_channel_id: 5442697, role: regulatory_balance}
      - {title: GEOMETRIA NOVA, arena_channel_id: 5442781, role: figure_eight_visual_family}
    explain_disclosures:
