research_question: >-
  Does Plate emerge naturally from the existing NEXAH body of work, or is it
  merely a new metaphor?

working_hypothesis: >-
  A Plate may be a bounded representation produced by observing a larger field
  from a particular orientation.

finding:
  outcome: implicit_editorial_representational_pattern
  natural_emergence: supported_with_limits
  strongest_classification:
    - editorial_pattern
    - visual_grammar
  secondary_classification:
    - explanatory_metaphor
  unsupported_classification:
    - canonical_concept
    - operator
    - orientation_primitive
    - universal_representation_type
  confidence: medium_high
  rationale: >-
    Plate is already present in Library Architecture and several Works give it
    a bounded, projective, perspectival, sequential, or navigational function.
    The repository does not establish it as the form of every representation
    or as a new executable primitive.

review_only_formulation: >-
  A Plate is a bounded human-facing representation of a larger field,
  produced through a declared or implied selection, perspective, projection,
  and scale, and arranged to support comparison, reflection, explanation, or
  transition.

