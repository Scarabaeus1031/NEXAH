  title: Leonardo Translations  The Room That Looks Back
  description: 'A visual and conceptual exploration of  Leonardo da Vinci’s perception architectures.

    Rather than treating Leonardo’s paintings as static images, this series examines them as dynamic systems
    of orientation, light, geometry, shadow, transition and emergence.

    Through visual translations, architectural analysis and relational field models, the project investigates
    how perception itself is constructed.

    The goal is not to explain Leonardo historically, but to explore the deeper mechanisms of seeing that
    his works reveal.

    In this sense, Leonardo becomes less a painter of objects and more an engineer of perception.

    The Room That Looks Back serves as the entry point into this journey.'
