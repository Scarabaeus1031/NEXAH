  title: '01 - NEXAH · START · CORE ORIENTATION  '
  description: 'NEXAH Core Orientation

    Welcome to NEXAH — an open cartography laboratory for orientation in complex systems.

    Rather than building another isolated model, NEXAH creates maps that reveal structure, transition
    and orientation across different domains. It brings together research, visual design and storytelling
    to make complexity easier to explore.

    This channel is the main entrance to the project.

    Start with The Operator’s Handbook for an introduction to the core ideas, then continue through the
    five-book Human Journey or explore the maps, atlases and research at your own pace.

    This is not a finished theory.

    It is a growing landscape for exploration.

    Welcome to the map.

    — Thomas K. R. Hofmann'
