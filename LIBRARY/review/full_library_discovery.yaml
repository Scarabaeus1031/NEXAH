  current_title: BEYOND INFORMATION
  current_description: "Finding Orientation in the Age of Intelligence  \nWe have more information than\
    \ any  generation before us.\nMore knowledge.\nMore experts.\nMore news.\nMore opinions.\nMore answers.\
    \ \nYet many people feel less certain about where to look, what matters, and how to move forward.\n\
