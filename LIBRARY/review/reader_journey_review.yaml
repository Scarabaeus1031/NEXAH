schema_version: '1.0'
review_stage: reader_journey_human_tests
review_status: proposed
source_classification: full_library_classification.yaml
policy:
  human_first: true
  kernel_is_evaluator_not_authority: true
  allocates_ids: false
  modifies_registry: false
  writes_to_arena: false
  proposal_results_must_be_labeled: true
  every_answer_requires_provenance: true
answer_modes:
  reader:
    visible_output: A short curated answer without scores, Operator IDs, or provenance detail.
    default_limit: 5
    internal_explanation_required: true
  explain:
    visible_output: Reasons, Operators, Series, relations, canonical/proposal state, and provenance.
    on_request: true
