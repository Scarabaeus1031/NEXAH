  prompt: I do not know NEXAH. Where do I begin?
  hypothesis: Move from entrance and human guide, through language into the foundation model, then toward map and
    practice.
  friction_points:
  - START is not visible as the first entry on the public Channels landing page.
  - THE VISITOR’S GUIDE explains the Library Rooms but does not provide clickable onward links to the next Works.
  - The journey contains six steps because START is Navigation; the remaining five are Works.
  review_state: reader_test_pending
