  - NEXAH ATLAS — THE OPERATIONAL GEOMETRY OF TRANSITION should be tested as an explicit bridge.
  - NEXAH MATHEMATICA I is a Proposal and its relation to Field Atlas III is not yet curated.
  - THE LIVING EQUATION may be a synthesis destination, but this has not been tested by a reader.
