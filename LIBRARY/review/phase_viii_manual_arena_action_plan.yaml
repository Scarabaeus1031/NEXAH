optional_recommendations:
  approval_required: true
  queue_state: not_added
  items:
    - id: P8-R00A
      title: Add Research entrance from START to Field Atlas I
      reason: It makes the accepted Research Journey discoverable from the primary entrance.
    - id: P8-R00B
      title: Add Atlases entrance from START to System Atlases
      reason: It separates open atlas exploration from the three linear Reader Journeys.
    - id: P8-R01
      title: Add reader exits to FIELD GUIDE
      reason: The research index currently has no direct Channel connections.
    - id: P8-R02
      title: Add Reference exits to PERSPECTIVES & REFERENCES
      reason: The reference room currently has no direct Channel connections.
    - id: P8-R03
      title: Express confirmed Language, Orientation, Human Journey, and XV core order
      reason: Confirmed Series order is not publicly walkable.
    - id: P8-R04
      title: Present Whiteboard members as an unordered gallery
      reason: The Series is not yet approved as a public sequence.
post_edit_checks:
  - capture a new immutable Source Snapshot
  - run Traversability for the edited journey
  - run Editorial Diff against the prior snapshot
  - verify no unintended title, description, sequence, or availability change
  - update ACQ review state only through explicit repository review
  - run Health and Release Check
