  live_title: 'FIELD ATLAS II The Architecture of Agency '
  description: "Description\nThe second Field Atlas of the NEXAH Operator Library.\nWhat allows a living system to persist,\
    \ adapt and act? \nRather than treating agency as an isolated property of intelligent organisms, Field Atlas II explores\
    \ it as a phenomenon that may emerge across many kinds of systems—from physical fields and biological development to cognition,\
    \ collective behavior and adaptive networks.\nThrough visual maps, historical perspectives and structural diagrams, this\
    \ atlas investigates the relationships between fields, transitions, organization and emergence.\nInstead of offering a\
    \ single theory, it proposes a cartography for exploring one of science’s most fundamental questions:\nHow does structure\
    \ become capable of action?\nTopics include:\n• The field before form\n• Emergence and self-organization\n• Morphogenesis\
    \ and developmental systems\n• Agency across scales\n• Transition as the architecture of becoming\nPart of the NEXAH Operator\
    \ Library."
