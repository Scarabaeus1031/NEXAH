  live_title: ✦ MAP ATLAS ✦  ⟡ A Visual History of Human Orientation ⟡
  description: "A visual atlas exploring how humans navigate reality through maps, systems, symbols, perception, networks\
    \ and transformation. \nFrom ancient star charts and trade routes\nto cities, infrastructures, consciousness and planetary\
    \ systems —\nthis project traces the evolution of orientation across scales of human experience.\nMAP ATLAS is not a doctrine.\n\
    Not a fixed worldview.\nNot a final map.\nIt is an open cartography of perspectives.\nA journey through:\nterritory and\
    \ relation\nmemory and transformation\nobservation and navigation\nsystems and meaning\nBuilt through visual storytelling,\
    \ layered diagrams, historical references and speculative cultural cartography.\nWe map to understand.\nWe connect to\
    \ orient.\nWe navigate becoming.\n⟡ The journey continues. ⟡"
