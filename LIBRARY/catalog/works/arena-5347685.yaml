    \ is not something that happens to us.\nThe future is something we build together.\nAudience\nFor builders.\nFor teachers.\n\
    For parents.\nFor students.\nFor dreamers.\nFor skeptics.\nFor anyone who believes that better maps can create better\
    \ futures.\nSeries Tagline\nWonder ignites.\nCuriosity guides.\nWisdom remains.\nLove leads.\nLegacy lives."
