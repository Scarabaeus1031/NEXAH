  live_title: NEXAH XV ATLAS  - Two Sides of One Medal
  description: "NEXAH XV ATLAS is a visual exploration of reality as relation, transition, and navigation.\nIt combines structural\
    \ thinking, geometry, systems theory, cognition, science, art, perception, and human experience into a unified atlas language.\
    \ \nThe project does not seek a final answer or absolute theory.\nInstead, it explores how meaning, structure, orientation,\
    \ coherence, and transformation emerge through relations between systems, observers, and worlds.\nThe atlas moves between:\n\
    mathematics & feeling\nlogic & experience\nstructure & story\nscience & perception\nmaps & reality\nThrough visual plates,\
    \ symbolic diagrams, human-centered perspectives, and transition geometries, the series builds an accessible language\
    \ for navigating complexity without reducing reality to a single worldview.\nNot the what.\nNot the how much.\nThe way\
    \ things relate, persist, transform, and become."
