  live_title: 'Field Atlas I —     Water '
  description: "A Cartography of Transition \nThe first of the Field Atlas Series.\nWater is not presented here as a chemical\
    \ substance, but as a landscape of transitions.\nThis atlas explores how liquid water organizes itself through configurations,\
    \ gradients, resonances and changing states. Instead of asking what water is, it asks how patterns emerge, stabilize and\
    \ transform across scales.\nUsing visual maps, diagrams and field boards, Field Atlas I introduces a cartographic approach\
    \ to understanding one of nature’s most dynamic systems.\nTopics include:\n• Water as a landscape of transitions\n• HDL\
    \ / LDL organization\n• Configuration spaces and transition landscapes\n• Geometry, gradients and resonance\n• Cartography\
    \ as a method for understanding complexity\nPart of the FIELD ATLAS SERIES."
