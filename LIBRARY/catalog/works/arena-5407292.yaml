  live_title: THE ATLAS OF ATLASES
  description: "How do human beings find their way through reality?  \nThis collection is the entrance hall of the NEXAH Library.\n\
    Rather than presenting a single theory, it maps three complementary ways of understanding orientation:\n• Relational Cartography\
    \ — how relations create structure and meaning.\n• The Atlas of Life — how living systems grow, adapt and remain coherent.\n\
    • Design as Orientation — how humans have always designed tools to navigate reality, from cave paintings to cognitive\
    \ maps.\nTogether they form an atlas of atlases:\na map that connects maps.\nAcross science, nature, architecture, psychology,\
    \ design and culture, the same recurring motifs appear again and again:\nRelation.\nOrientation.\nTransition.\nNavigation.\n\
    Meaning.\nReturn.\nThis collection is not intended as a finished worldview.\nIt is an invitation to compare perspectives,\
    \ discover patterns and build better maps for navigating an increasingly complex world.\nBecause before we design better\
    \ systems,\nwe first need better ways to orient ourselves within them.\nOrientation is not the destination.\nIt is the\
    \ beginning of every meaningful journey.\nNEXAH Library\nThe Architecture of Orientation"
