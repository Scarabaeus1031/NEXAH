  live_title: 'LOGARITHMIC UNIVERSE —  5 MOVEMENTS OF REALITY '
  description: 'Inspired by Pablo Carlos Budassi''s "Observable Universe", this visual essay explores what happens when the
    observable universe is viewed not as a static object, but as a living field of orientation.

    Beginning with a familiar map of the cosmos, the journey gradually turns the perspective. The universe becomes a flow,
    the flow becomes a field, and the field becomes a language of relationships.

    The book does not propose a finished cosmological theory. It presents a visual framework for thinking about resonance,
    transformation, coherence and experience across multiple scales.

    Rather than providing answers, it invites readers to experiment with another way of seeing.'
