  live_title: NEXAH XV ATLAS Relational Cartography of Human Reality
  description: "This atlas explores a simple proposition: \nReality is encountered through relations before it is encountered\
    \ as objects.\nAcross fifteen interconnected plates, the atlas investigates perception, orientation, transition, navigation,\
    \ culture, myth and meaning as expressions of relational structure. \nRather than describing a fixed worldview, it proposes\
    \ a visual language for understanding how humans create orientation within complex realities.\nAn atlas of relations,\
    \ transitions, fields and becoming."
