  live_title: THE LANGUAGE ATLAS
  description: 'The Language Atlas of Orientation

    A living cartography of perspectives.

    Description

    Maps are not answers.

    They are invitations.

    The Atlas brings together the landscapes, books, whiteboards, field studies and visual research of NEXAH into one evolving
    cartography.

    Every page is a place.

    Every connection is a possible path.

    Every reader discovers a different journey.

    It is not meant to be read from beginning to end.

    It is meant to be explored.

    One field.

    Many maps.

    Infinite perspectives.'
