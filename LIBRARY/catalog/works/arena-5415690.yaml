  description: "A practical introduction to Orientation Design. \nThis volume expands the foundations  established in Orientation\
    \ Atlas and introduces the methods, principles and workflows behind the NEXAH framework.\nRather than focusing on a single\
    \ discipline, it explores how orientation can be observed, represented, designed and applied across complex systems.\n\
    Topics include:\n• Orientation as a design discipline\n• Research methods and visual thinking\n• Mapping and representation\n\
