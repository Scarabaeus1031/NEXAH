  description: 'THE OPERATOR Λ

    Librarybook

    Edition 0.1 · LIV LIB · 00

    The largest Librarybook in the NEXAH Library.

    A curated collection of maps, operators, white plates, notebooks, field guides and visual explorations.

    Not a handbook.

    Not an encyclopedia.

    Not a finished theory.

    A Librarybook.

    Open it anywhere.

    Every page is a room.

    Every room is connected.

    Every connection reveals another map.

    Built to be explored.

    Built to be extended.

    Built to return to.

    The library grows.

    So does the reader.

    ∞ NEXAH Cartography Laboratory'
