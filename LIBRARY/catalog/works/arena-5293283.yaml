  live_title: The Architecture of Becoming 🦋
  description: "NEXAH — The Architecture of Becoming\nA visual atlas about emergence, structure, navigation, and belonging.\n\
    This series follows a simple question:\nHow does order become experience?\nBeginning with ORIGIO — the question of why\
    \ stable forms emerge at all — the journey moves through number, geometry, resonance, networks, fields, apertures, navigation,\
    \ reflection, and possibility. \nThe result is not a theory of reality, but a cartography of becoming.\nEach plate represents\
    \ a layer in the transformation from potential to structure, from structure to movement, and from movement to meaning.\n\
    The map is not the territory.\nYet every map is part of the territory becoming aware of itself."
