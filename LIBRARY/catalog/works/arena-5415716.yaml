  live_title: 'Orientation Atlas Vol.I '
  description: 'The entry point into the NEXAH research landscape.

    The Orientation Atlas introduces the core ideas, structures and visual language behind the NEXAH project. Rather than
    explaining every concept in depth, it provides a map of the territory—revealing how the different research areas connect
    to form a coherent framework.

    This volume is designed as an overview: a starting point for readers who want to understand the landscape before exploring
    its individual regions.

    Topics include:

    • Orientation Design as a research discipline

    • The NEXAH portfolio architecture

    • Research ecosystem and infrastructure

    • Methods and research workflow

    • The complete Atlas of Orientation

    Part of the NEXAH Visual Research Series.

    Volume I — Orientation Atlas

    “Here is the landscape.”

    ↓

    Volume II — Orientation Design

    “Here is how we work within it.”

    ↓

    Volume III — Orientation Theory

    “Here is why it works.”

    ↓

    Volume IV — The Architecture of Orientation

    “Here is how the whole ecosystem comes together.”'
